<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Flow" />
<meta name="theme-color" content="#0b0b0f" />
<title>Flow — voice dictation</title>
<style>
  :root{
    --bg:#0b0b0f; --card:#16161d; --fg:#f5f5f7; --muted:#b9b9c4;
    --accent:#3ddc84; --accentfg:#04120a; --rec:#ff453a; --border:#2a2a36;
    --focus:#7cc4ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:500 19px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:16px; max-width:720px; margin:0 auto;
  }
  h1{font-size:22px;margin:4px 0 0;display:flex;align-items:center;gap:10px}
  .status{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; font-size:20px; min-height:56px; display:flex; align-items:center;
  }
  .status.live{border-color:var(--rec)}
  .status.busy{border-color:var(--focus)}
  #record{
    appearance:none; border:0; border-radius:20px; width:100%; padding:28px 20px;
    font-size:26px; font-weight:800; color:var(--accentfg); background:var(--accent);
    display:flex; align-items:center; justify-content:center; gap:14px; cursor:pointer;
  }
  #record.recording{background:var(--rec); color:#fff}
  #record .dot{width:20px;height:20px;border-radius:50%;background:currentColor;display:inline-block}
  #record.recording .dot{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .modes{display:flex;gap:8px;flex-wrap:wrap}
  .modes label{
    flex:1 1 30%; background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px; text-align:center; cursor:pointer; font-size:17px; position:relative;
  }
  .modes input{position:absolute;opacity:0;width:1px;height:1px}
  .modes input:checked + span{color:var(--accent);font-weight:800}
  .modes label:has(input:checked){border-color:var(--accent)}
  .modes small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:2px}
  textarea{
    width:100%; min-height:200px; resize:vertical; background:var(--card); color:var(--fg);
    border:1px solid var(--border); border-radius:14px; padding:16px; font-size:19px; line-height:1.6;
  }
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row button{
    flex:1 1 30%; appearance:none; border:1px solid var(--border); background:var(--card);
    color:var(--fg); border-radius:12px; padding:16px; font-size:18px; font-weight:700; cursor:pointer;
  }
  .opts{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:16px}
  .opts label{display:flex;align-items:center;gap:8px}
  input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .hint{color:var(--muted);font-size:15px}
</style>
</head>
<body>
  <h1>🎙️ Flow<span class="hint" style="font-weight:500">— free dictation</span></h1>

  <div id="status" class="status" role="status" aria-live="assertive">Ready. Tap the big button or press Space to start talking.</div>

  <button id="record" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span id="recLabel">Start talking</span></button>

  <div class="modes" role="radiogroup" aria-label="Transcription mode">
    <label><input type="radio" name="mode" value="verbatim"><span>Verbatim<small>every word, um &amp; uh</small></span></label>
    <label><input type="radio" name="mode" value="clean" checked><span>Clean<small>fillers removed</small></span></label>
    <label><input type="radio" name="mode" value="notes"><span>Notes<small>bulleted</small></span></label>
  </div>

  <textarea id="out" aria-label="Transcript. Editable — fix any word before copying." placeholder="Your words show up here…"></textarea>

  <div class="row">
    <button id="copy">Copy</button>
    <button id="share">Share</button>
    <button id="clear">Clear</button>
  </div>

  <div class="opts">
    <label><input type="checkbox" id="speak" checked> Speak status aloud</label>
    <label><input type="checkbox" id="beeps" checked> Start/stop beeps</label>
    <label><input type="checkbox" id="append" checked> Add to existing text</label>
  </div>

  <p class="hint">On iPhone: <strong>Share → Add to Home Screen</strong> for a full-screen app icon. Space bar toggles recording when you're not typing.</p>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var statusEl=$("status"), recBtn=$("record"), recLabel=$("recLabel"), out=$("out");
  var speakChk=$("speak"), beepChk=$("beeps"), appendChk=$("append");
  var LISTEN_URL = "/api/deepgram-listen"; // same origin as this page

  var ac=null;
  function actx(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ac; }
  function beep(kind){
    if(!beepChk.checked) return; var c=actx(); if(!c) return;
    try{ if(c.state==="suspended") c.resume(); var o=c.createOscillator(),g=c.createGain();
      o.connect(g); g.connect(c.destination);
      o.frequency.value = kind==="start"?660 : kind==="stop"?440 : 300;
      g.gain.setValueAtTime(0.0001,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25,c.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.18);
      o.start(); o.stop(c.currentTime+0.2);
    }catch(e){}
  }
  function say(t){
    if(!speakChk.checked || !("speechSynthesis" in window)) return;
    try{ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }catch(e){}
  }
  function setStatus(t, cls){ statusEl.textContent=t; statusEl.className="status"+(cls?(" "+cls):""); }
  function announce(t, cls){ setStatus(t, cls); say(t); }

  var mediaRec=null, chunks=[], stream=null, recording=false, busy=false, maxTimer=null;

  function pickMime(){
    var opts=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac"];
    for(var i=0;i<opts.length;i++){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported(opts[i])) return opts[i];
    }
    return "";
  }

  async function start(){
    if(recording||busy) return;
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
    }catch(e){ announce("Microphone blocked. Allow mic access for this site, then try again."); return; }
    var mime=pickMime(); chunks=[];
    try{ mediaRec = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream); }
    catch(e){ mediaRec = new MediaRecorder(stream); }
    mediaRec.ondataavailable=function(ev){ if(ev.data && ev.data.size) chunks.push(ev.data); };
    mediaRec.onstop=onStop;
    mediaRec.start();
    recording=true;
    recBtn.classList.add("recording"); recBtn.setAttribute("aria-pressed","true"); recLabel.textContent="Stop & transcribe";
    beep("start"); announce("Listening. Talk now.", "live");
    clearTimeout(maxTimer); maxTimer=setTimeout(function(){ if(recording) stop(); }, 120000);
  }

  function stop(){
    if(!recording) return;
    recording=false; clearTimeout(maxTimer);
    recBtn.classList.remove("recording"); recBtn.setAttribute("aria-pressed","false"); recLabel.textContent="Start talking";
    beep("stop");
    try{ mediaRec.stop(); }catch(e){}
  }

  async function onStop(){
    try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    if(!chunks.length){ announce("Didn't catch any audio. Try again."); return; }
    var type = (mediaRec && mediaRec.mimeType) || chunks[0].type || "audio/webm";
    var blob = new Blob(chunks, { type:type });
    busy=true; announce("Processing…", "busy");
    var mode = (document.querySelector('input[name=mode]:checked')||{}).value || "clean";
    var dgMode = (mode==="notes") ? "clean" : mode;
    try{
      var r = await fetch(LISTEN_URL+"?mode="+encodeURIComponent(dgMode), {
        method:"POST", headers:{ "Content-Type": type }, body: blob
      });
      var j = await r.json();
      if(!r.ok){ busy=false; announce("Error: "+((j&&j.error)||("HTTP "+r.status))); return; }
      var text = (j.transcript||"").trim();
      if(!text){ busy=false; announce("Nothing heard — try speaking a little louder.", "busy"); return; }
      if(mode==="notes") text = toNotes(text);
      insert(text, mode);
      busy=false; announce("Added.");
    }catch(e){ busy=false; announce("Network error. Check your connection and try again."); }
  }

  function toNotes(t){
    var parts = t.replace(/\s+/g," ").split(/(?<=[.!?])\s+/).map(function(s){return s.trim();}).filter(Boolean);
    return parts.map(function(s){ return "• "+s; }).join("\n");
  }

  function insert(text, mode){
    if(appendChk.checked && out.value.trim()){
      var sep = (mode==="notes") ? "\n" : " ";
      out.value = out.value.replace(/\s+$/,"") + sep + text;
    } else {
      out.value = text;
    }
    out.selectionStart = out.selectionEnd = out.value.length;
  }

  function toggle(){ recording ? stop() : start(); }
  recBtn.addEventListener("click", toggle);

  $("copy").addEventListener("click", async function(){
    var t=out.value; if(!t.trim()){ announce("Nothing to copy yet."); return; }
    try{ await navigator.clipboard.writeText(t); announce("Copied to clipboard."); }
    catch(e){ out.focus(); out.select(); try{ document.execCommand("copy"); announce("Copied."); }catch(_){ announce("Text is selected — copy it manually."); } }
  });
  $("share").addEventListener("click", async function(){
    var t=out.value; if(!t.trim()){ announce("Nothing to share yet."); return; }
    if(navigator.share){ try{ await navigator.share({text:t}); }catch(e){} }
    else { announce("Sharing isn't available here — use Copy instead."); }
  });
  $("clear").addEventListener("click", function(){ out.value=""; announce("Cleared."); out.focus(); });

  document.addEventListener("keydown", function(e){
    if(e.code==="Space"){
      var tag=(document.activeElement&&document.activeElement.tagName)||"";
      if(/^(TEXTAREA|INPUT|SELECT|BUTTON)$/.test(tag)) return;
      e.preventDefault(); toggle();
    }
  });

  if(!navigator.mediaDevices || !window.MediaRecorder){
    announce("This browser can't record audio. Open Flow in Safari or Chrome.");
    recBtn.disabled=true;
  }
})();
</script>
</body>
</html>
